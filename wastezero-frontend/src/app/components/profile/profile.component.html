<div class="page-layout">
  <app-sidebar></app-sidebar>
  <div class="content">
    <h2>My Profile</h2>
    <mat-card class="profile-card">
      <mat-card-content>
        <div class="avatar-section">
          <div class="avatar">{{ user?.name?.charAt(0)?.toUpperCase() }}</div>
          <div>
            <h3>{{ user?.name }}</h3>
            <span class="role-chip">{{ role | titlecase }}</span>
          </div>
        </div>

        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Full Name</mat-label>
            <input matInput formControlName="name">
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email (cannot change)</mat-label>
            <input matInput formControlName="email">
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Location</mat-label>
            <input matInput formControlName="location" placeholder="City, State">
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width" *ngIf="role === 'volunteer'">
            <mat-label>Skills (comma-separated)</mat-label>
            <input matInput formControlName="skills" placeholder="e.g. Plastic, E-waste, Organic">
            <mat-hint>Skills help match you with the right opportunities</mat-hint>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" [disabled]="loading">
            Save Changes
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
